
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- 缓存控制 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>兔兔爱叫连连看</title>
    <!-- Telegram Games: 不允许外部链接，使用系统字体和内联样式 -->
    <script>
      // 检测是否为Telegram环境（多种检测方式确保可靠性）
      (function() {
        function isTelegramEnv() {
          // 方式1: 检查Telegram WebApp对象
          if (typeof window !== 'undefined') {
            if (window.Telegram?.WebApp) return true;
            if (window.parent?.Telegram?.WebApp) return true;
          }
          // 方式2: 检查URL参数（Telegram会传递tgWebAppData）
          if (typeof window !== 'undefined' && window.location) {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('tgWebAppData')) return true;
            // 检查hash中的参数
            const hash = window.location.hash;
            if (hash && hash.includes('tgWebAppData')) return true;
          }
          // 方式3: 检查referrer（如果从Telegram打开）
          if (typeof document !== 'undefined' && document.referrer) {
            if (document.referrer.includes('telegram.org') || 
                document.referrer.includes('t.me')) return true;
          }
          return false;
        }
        
        const isTelegram = isTelegramEnv();
        
        if (!isTelegram) {
          // 非Telegram环境：加载外部资源
          const link1 = document.createElement('link');
          link1.rel = 'preconnect';
          link1.href = 'https://fonts.googleapis.com';
          document.head.appendChild(link1);
          
          const link2 = document.createElement('link');
          link2.rel = 'preconnect';
          link2.href = 'https://fonts.gstatic.com';
          link2.crossOrigin = 'anonymous';
          document.head.appendChild(link2);
          
          const link3 = document.createElement('link');
          link3.rel = 'stylesheet';
          link3.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap';
          document.head.appendChild(link3);
          
          const script = document.createElement('script');
          script.src = 'https://cdn.tailwindcss.com';
          document.head.appendChild(script);
        } else {
          // Telegram环境：使用系统字体，Tailwind将通过构建后的CSS提供
          console.log('[Telegram] External links disabled per Telegram Games rules');
          // 标记为Telegram环境，供后续代码使用
          window.__IS_TELEGRAM_ENV__ = true;
        }
      })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0f172a;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            touch-action: none;
        }
        
        /* 可爱的数字字体 */
        .cute-number {
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        
        /* 可爱的标签字体 */
        .cute-label {
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            letter-spacing: 0.1em;
        }
        canvas {
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 可爱的动画效果 */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        
        @keyframes scale-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes fade-in {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        
        @keyframes gradient-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        .animate-wiggle {
            animation: wiggle 2s ease-in-out infinite;
        }
        
        .animate-sparkle {
            animation: sparkle 1.5s ease-in-out infinite;
        }
        
        .animate-scale-in {
            animation: scale-in 0.5s ease-out;
        }
        
        .animate-fade-in {
            animation: fade-in 0.5s ease-out;
        }
        
        .bg-gradient-animated {
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
        }
        
        /* 横屏模式：游戏进行时 */
        .landscape-mode {
            /* 确保横屏布局 */
        }
        
        /* 竖屏模式：开始界面 */
        .portrait-mode {
            /* 确保竖屏布局 */
        }
        
        /* 移动端全屏样式 */
        @media (max-width: 768px) {
            .landscape-mode {
                /* 横屏时隐藏可能的滚动条 */
                overflow: hidden;
                /* 确保全屏显示 */
                height: 100vh;
                height: 100dvh; /* 动态视口高度，隐藏地址栏 */
            }
            
            /* 隐藏地址栏的额外处理 */
            html, body {
                height: 100%;
                height: 100dvh;
                overflow: hidden;
            }
        }
        
        /* 全屏时的样式 */
        :fullscreen,
        :-webkit-full-screen,
        :-moz-full-screen,
        :-ms-fullscreen {
            width: 100%;
            height: 100%;
        }
    </style>
<!-- Telegram Games: 不允许外部链接，React将通过构建后的文件提供 -->
<script>
  (function() {
    // 检查是否已标记为Telegram环境，或重新检测
    const isTelegram = window.__IS_TELEGRAM_ENV__ || 
      (typeof window !== 'undefined' && (
        window.Telegram?.WebApp || 
        window.parent?.Telegram?.WebApp ||
        new URLSearchParams(window.location.search).has('tgWebAppData')
      ));
    
    if (!isTelegram) {
      // 非Telegram环境：使用esm.sh（仅开发环境，生产环境使用构建后的文件）
      const importMap = document.createElement('script');
      importMap.type = 'importmap';
      importMap.textContent = JSON.stringify({
        "imports": {
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
        }
      });
      document.head.appendChild(importMap);
    }
  })();
</script>

<script>
    // 强制清除缓存和Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for(let registration of registrations) {
                registration.unregister();
            }
        });
    }
    
    // 清除所有缓存
    if ('caches' in window) {
        caches.keys().then(function(names) {
            for (let name of names) {
                caches.delete(name);
            }
        });
    }
    
    // 添加版本号到控制台，方便调试
    const version = new Date().toISOString();
    console.log('Game Version:', version);
    document.documentElement.setAttribute('data-version', version);
